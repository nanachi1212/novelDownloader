name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # requirements-dev.lock is a Windows-only hash lock (pins pywin32), matching
    # this project's documented primary platform; it does not install on Linux,
    # so this job only runs on windows-latest rather than forking the lock file.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
