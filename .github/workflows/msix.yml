name: MSIX validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  msix-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Build unsigned validation MSIX
        shell: pwsh
        run: .\packaging\msix\build-msix.ps1 -Mode Validation -PackageVersion '1.6.8.0'
      - name: Upload validation MSIX
        uses: actions/upload-artifact@v4
        with:
          name: novelDownloader-msix-validation
          path: dist/msix/*.msix
